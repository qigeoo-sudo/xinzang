<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Lydia Chen：圆润脸、月牙笑眼、珍珠耳钉、鼠尾草绿西装+白衬衫 -->
  <rect width="200" height="200" fill="#F6EDDE"/>
  <circle cx="100" cy="100" r="92" fill="#FBF5E9"/>

  <!-- 后层发（齐颌内扣，更圆润） -->
  <path d="M64 88 C60 46 82 34 100 34 C118 34 140 46 136 88 C137 102 137 114 133 122 C129 130 120 129 120 119 L120 94 Z" fill="#2E2620"/>
  <path d="M64 88 C63 102 63 114 67 122 C71 130 80 129 80 119 L80 94 Z" fill="#2E2620"/>

  <!-- 白衬衫 -->
  <path d="M78 144 L100 154 L122 144 L116 136 L100 145 L84 136 Z" fill="#FFFFFF"/>
  <!-- 鼠尾草绿西装 -->
  <path d="M29 200 C31 170 50 152 76 145 L100 154 L124 145 C150 152 169 170 171 200 Z" fill="#75875A"/>
  <path d="M76 145 L94 167 L85 174 L70 151 Z" fill="#657650"/>
  <path d="M124 145 L106 167 L115 174 L130 151 Z" fill="#657650"/>

  <!-- 脖子 -->
  <path d="M91 110 h18 v29 c0 5 -18 5 -18 0 Z" fill="#F9DFC9"/>
  <path d="M91 110 h18 v9 c-6 5 -12 5 -18 0 Z" fill="#EFC9AE"/>

  <!-- 耳朵 + 珍珠耳钉 -->
  <circle cx="70" cy="93" r="5.5" fill="#F9DFC9"/>
  <circle cx="130" cy="93" r="5.5" fill="#F9DFC9"/>
  <circle cx="70" cy="97.5" r="1.7" fill="#FFFDF6" stroke="#D8CDB8" stroke-width=".6"/>
  <circle cx="130" cy="97.5" r="1.7" fill="#FFFDF6" stroke="#D8CDB8" stroke-width=".6"/>

  <!-- 圆润脸 -->
  <ellipse cx="100" cy="88" rx="30" ry="31.5" fill="#F9DFC9"/>

  <!-- 前发：侧分内扣波波头 -->
  <path d="M69 90 C64 50 84 38 100 38 C116 38 136 50 131 90 C129 72 121 60 100 60 C90 60 82 65 77 73 C73 79 70 84 69 90 Z" fill="#2E2620"/>
  <path d="M69 90 C67 102 67 114 70 123 C73 129 79 127 78 119 C76 110 75 98 76 90 Z" fill="#2E2620"/>
  <path d="M131 90 C133 102 133 114 130 123 C127 129 121 127 122 119 C124 110 125 98 124 90 Z" fill="#2E2620"/>
  <path d="M85 48 C93 42 106 42 114 47 C104 45 93 46 85 52 Z" fill="#4C3C31" opacity=".65"/>

  <!-- 细弯眉 -->
  <path d="M81 78.5 Q88 74.5 95 77.5" stroke="#3A2E26" stroke-width="1.9" fill="none" stroke-linecap="round"/>
  <path d="M105 77.5 Q112 74.5 119 78.5" stroke="#3A2E26" stroke-width="1.9" fill="none" stroke-linecap="round"/>

  <!-- 月牙笑眼 -->
  <path d="M83.5 88 Q88 83.5 92.5 88" stroke="#33261E" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M107.5 88 Q112 83.5 116.5 88" stroke="#33261E" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <!-- 圆鼻头 -->
  <path d="M100 93.5 q1.6 3.8 -1.4 5" stroke="#D9A98C" stroke-width="1.7" fill="none" stroke-linecap="round"/>

  <!-- 开朗笑 -->
  <path d="M91 105 Q100 112.5 109 105" stroke="#C96F5E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M95 111 Q100 113 105 111" stroke="#C96F5E" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".5"/>

  <!-- 腮红（更明显） -->
  <ellipse cx="79" cy="99" rx="5.5" ry="3.2" fill="#F2B49A" opacity=".5"/>
  <ellipse cx="121" cy="99" rx="5.5" ry="3.2" fill="#F2B49A" opacity=".5"/>
</svg>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>榨职机 · 注册流程原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2E6D8; --hero:#FDF5EC; --ink:#2C3E5C; --body:#5A6B7E;
    --orange:#F5A623; --orange-dark:#D4881A;
    --input-bg:#FCF2F0; --input-border:#E8B5B5;
    --card-line:rgba(209,213,219,.4); --muted:#9C8E7C; --danger:#C0654A;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--hero) 0%,var(--bg) 360px);
    min-height:100vh;
  }
  /* 顶栏 */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.6);
  }
  .topbar-inner{ max-width:448px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:12px; }
  .logo{
    width:40px; height:40px; border-radius:12px;
    background:linear-gradient(135deg,#F5A623 0%,#E8853A 100%);
    color:#fff; font-family:'Noto Serif SC',serif; font-weight:900; font-size:20px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 3px rgba(0,0,0,.12);
  }
  .brand-en{ font-size:14px; font-weight:600; color:#A67B5B; line-height:1.2; }
  .brand-cn{ font-size:12px; color:var(--body); line-height:1.4; }

  main{ max-width:448px; margin:0 auto; padding:32px 16px 64px; }
  h1{
    font-family:'Noto Serif SC',Georgia,serif;
    font-size:30px; line-height:1.35; font-weight:900; letter-spacing:-.5px; margin-bottom:8px;
  }
  h1 .hl{ color:var(--orange); }
  .subtitle{ font-size:14px; color:var(--body); margin-bottom:24px; }

  /* 步骤条 */
  .stepper{ display:flex; align-items:flex-start; padding:0 8px; margin-bottom:24px; }
  .step-node{ width:56px; display:flex; flex-direction:column; align-items:center; flex-shrink:0; }
  .step-dot{
    width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:600; background:rgba(255,255,255,.7); border:2px solid #E0D3BF; color:#A99E8C;
    transition:all .2s;
  }
  .step-node.reached .step-dot{ background:#fff; border-color:var(--orange); color:var(--orange); }
  .step-node.passed .step-dot{ background:var(--orange); border-color:var(--orange); color:#fff; }
  .step-label{ font-size:11px; margin-top:6px; white-space:nowrap; color:#A99E8C; }
  .step-node.reached .step-label,.step-node.passed .step-label{ color:var(--ink); font-weight:600; }
  .step-line{ flex:1; height:2px; margin-top:15px; border-radius:2px; background:#E0D3BF; }
  .step-line.done{ background:var(--orange); }

  /* 卡片 */
  .card{
    background:rgba(255,255,255,.88);
    border:1px solid var(--card-line);
    border-radius:20px; padding:20px;
    animation:fadeIn .3s ease-in-out;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .badge{
    display:inline-block; font-size:11px; border-radius:999px; padding:4px 10px;
    background:rgba(245,166,35,.12); color:#B4780E; margin-bottom:16px;
  }
  .card h2{ font-size:18px; font-weight:700; margin-bottom:4px; }
  .card .step-sub{ font-size:13px; color:var(--body); margin-bottom:20px; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:14px; font-weight:600; margin-bottom:6px; }
  .field label .hint{ font-weight:400; font-size:12px; color:var(--muted); margin-left:6px; }
  .req{ color:#C0654A; margin-left:2px; }
  .field-err{ color:#C0654A; font-size:12px; margin:6px 0 0; min-height:0; }
  .field-err:empty{ display:none; }
  input.input-err{ border-color:#C0654A !important; }

  input[type=tel],input[type=text],input[type=password]{
    width:100%; background:var(--input-bg); border:2px solid var(--input-border); border-radius:10px;
    padding:12px 16px; font-size:15px; color:var(--ink); font-family:inherit;
    outline:none; transition:border-color .2s, box-shadow .2s;
  }
  input::placeholder{ color:#B6A89C; }
  input:focus{ border-color:var(--orange); box-shadow:0 0 0 3px rgba(245,166,35,.18); }
  input:disabled{ opacity:.4; cursor:not-allowed; }

  .pwd-wrap{ position:relative; }
  .pwd-toggle{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    background:none; border:none; font-size:12px; color:var(--body); font-family:inherit;
  }
  .code-row{ display:flex; gap:8px; }
  .code-row input{ flex:1; letter-spacing:4px; }
  .btn-code{
    flex-shrink:0; min-width:104px; border:none; border-radius:10px;
    background:var(--orange); color:#fff; font-size:14px; font-weight:600;
    font-family:inherit; padding:0 14px; white-space:nowrap; cursor:pointer;
    transition:transform .1s, opacity .2s;
  }
  .btn-code:active{ transform:scale(.96); }
  .btn-code:disabled{ opacity:.5; cursor:default; }

  /* 下拉 / 年月触发按钮 */
  .select-btn{
    width:100%; text-align:left; background:var(--input-bg); border:2px solid var(--input-border);
    border-radius:10px; padding:11px 16px; font-size:15px; font-family:inherit;
    display:flex; align-items:center; justify-content:space-between; cursor:pointer; color:#B6A89C;
  }
  .select-btn.has-value{ color:var(--ink); }
  .select-btn svg{ flex-shrink:0; margin-left:8px; color:var(--body); }
  .select-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .select-btn .btn-text{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .exp-group{ border:1px solid #E8B5B5; background:#FCF2F0; border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:12px; }
  .exp-row{ display:flex; align-items:center; gap:12px; min-width:0; }
  .exp-tag{ flex-shrink:0; width:34px; font-size:14px; color:#2C3E5C; }
  .exp-row .select-btn{ flex:1; min-width:0; width:auto; background:#fff; }
  .exp-row .select-btn .btn-text{ min-width:0; }
  #toastBox{ position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:80; max-width:90vw; background:rgba(44,62,92,.92); color:#fff; font-size:14px; padding:10px 16px; border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,.18); text-align:center; opacity:0; pointer-events:none; transition:opacity .25s; }
  #toastBox.show{ opacity:1; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  /* 勾选框 */
  .check-row{ display:flex; align-items:flex-start; gap:10px; margin-top:4px; cursor:pointer; user-select:none; }
  .check-row input{ width:16px; height:16px; margin-top:2px; accent-color:var(--orange); cursor:pointer; }
  .check-row span{ font-size:14px; line-height:1.6; color:var(--body); }

  /* chips */
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    border:1.5px solid #E8DCCB; background:#fff; color:var(--ink);
    border-radius:999px; padding:8px 14px; font-size:13px; font-family:inherit; cursor:pointer;
    transition:all .15s;
  }
  .chip:active{ transform:scale(.95); }
  .chip.on{ background:var(--orange); border-color:var(--orange); color:#fff; font-weight:600; }
  .chip-count{ font-size:12px; color:#B4780E; margin-top:8px; }

  /* 报错：吸顶 freeze，滚动也始终可见（sticky 挂在父盒上，才有粘附行程） */
  #alertBox{ position:sticky; top:72px; z-index:30; }
  .alert{ font-size:14px; padding:12px 16px; border-radius:10px; margin-bottom:16px; }
  .alert.err{
    background:#FBEDE8; color:var(--danger);
    border:1px solid rgba(192,101,74,.25);
    box-shadow:0 4px 12px rgba(192,101,74,.15);
  }
  .alert.info{ background:rgba(245,166,35,.12); color:#8a5f10; }

  .actions{ display:flex; gap:12px; margin-top:28px; }
  .btn{
    border:none; border-radius:10px; padding:13px 20px; font-size:14px; font-weight:700;
    font-family:inherit; cursor:pointer; transition:transform .1s, background .2s;
  }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-primary{ flex:1; background:var(--orange); color:#fff; }
  .btn-ghost{ background:rgba(90,107,126,.08); color:var(--body); font-weight:600; }
  .btn-danger-ghost{ background:rgba(192,101,74,.08); color:var(--danger); font-weight:600; }

  .foot-note{ text-align:center; font-size:12px; color:var(--muted); margin-top:24px; }

  /* 成功页 */
  .success-icon{
    width:56px; height:56px; border-radius:50%; background:rgba(245,166,35,.14);
    display:flex; align-items:center; justify-content:center; margin-bottom:16px;
  }
  .success-title{ font-family:'Noto Serif SC',serif; font-size:20px; font-weight:900; margin-bottom:4px; }
  .success-sub{ font-size:14px; color:var(--body); margin-bottom:20px; }
  .sum-group{ margin-bottom:20px; }
  .sum-group h3{
    font-size:14px; font-weight:700; padding-bottom:6px; margin-bottom:8px;
    border-bottom:1px solid rgba(216,210,197,.7);
  }
  .sum-row{ display:flex; gap:12px; font-size:13px; line-height:1.7; }
  .sum-row dt{ width:88px; flex-shrink:0; color:var(--muted); white-space:nowrap; }
  .sum-row dd{ flex:1; }

  /* 底部弹层 */
  .mask{
    position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.4);
    display:none; align-items:flex-end; justify-content:center;
  }
  .mask.show{ display:flex; }
  .sheet{
    width:100%; max-width:448px; background:#fff; border-radius:16px 16px 0 0;
    display:flex; flex-direction:column; max-height:72vh;
    animation:slideUp .25s ease-out;
  }
  @keyframes slideUp{ from{ transform:translateY(100%);} to{ transform:translateY(0);} }
  .sheet-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; border-bottom:1px solid var(--input-border);
    font-size:14px; font-weight:600; flex-shrink:0;
  }
  .sheet-close{ background:none; border:none; font-size:14px; color:var(--body); font-family:inherit; }
  .sheet-body{ overflow-y:auto; flex:1; -webkit-overflow-scrolling:touch; }
  .sheet-item{
    width:100%; text-align:left; background:none; border:none; border-bottom:1px solid rgba(216,210,197,.3);
    padding:14px 16px; font-size:14px; font-family:inherit; color:var(--ink);
    display:flex; align-items:center; justify-content:space-between; cursor:pointer;
  }
  .sheet-item:active{ background:#FAF7F4; }
  .sheet-item.sel{ color:var(--orange); font-weight:600; }
  .sheet-foot{
    padding:12px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--input-border);
    display:flex; gap:12px; flex-shrink:0;
  }
  .sheet-foot .btn{ padding:11px 16px; }
  .sheet-foot .spacer{ flex:1; }

  /* 年月选择器 */
  .month-years{ display:flex; gap:8px; overflow-x:auto; padding:12px 16px 4px; }
  .year-chip{
    flex-shrink:0; border:1.5px solid #E8DCCB; background:#fff; color:var(--ink);
    border-radius:999px; padding:6px 14px; font-size:13px; font-family:inherit; cursor:pointer;
  }
  .year-chip.on{ background:var(--orange); border-color:var(--orange); color:#fff; font-weight:600; }
  .month-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:12px 16px 16px; }
  .month-cell{
    border:1.5px solid #E8DCCB; background:#fff; color:var(--ink);
    border-radius:10px; padding:10px 0; font-size:14px; font-family:inherit; cursor:pointer;
  }
  .month-cell.on{ background:var(--orange); border-color:var(--orange); color:#fff; font-weight:600; }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">榨</div>
    <div>
      <div class="brand-en">Career Companion</div>
      <div class="brand-cn">榨职机</div>
    </div>
  </div>
</header>

<main>
  <!-- 表单区 -->
  <div id="formView">
    <h1>创建你的<span class="hl">账号</span></h1>
    <p class="subtitle">三步完成注册，开始和导师聊职业</p>

    <div class="stepper">
      <div class="step-node reached" data-node="1">
        <div class="step-dot" data-dot="1">1</div><div class="step-label">手机验证</div>
      </div>
      <div class="step-line" data-line="1"></div>
      <div class="step-node" data-node="2">
        <div class="step-dot" data-dot="2">2</div><div class="step-label">你的状态</div>
      </div>
      <div class="step-line" data-line="2"></div>
      <div class="step-node" data-node="3">
        <div class="step-dot" data-dot="3">3</div><div class="step-label">方向与地点</div>
      </div>
    </div>

    <div class="card">
      <div class="badge">原型页面 · 信息不会真正提交</div>
      <h2 id="stepTitle">第 1 步：手机验证</h2>
      <p class="step-sub hidden" id="stepSub"></p>

      <div id="alertBox"></div>
      <div id="toastBox"></div>

      <!-- 第 1 步 -->
      <div data-step="1">
        <div class="field">
          <label>手机号<span class="req">*</span></label>
          <input type="tel" id="phone" inputmode="numeric" maxlength="11" placeholder="请输入 11 位手机号" />
        </div>
        <div class="field">
          <label>密码<span class="req">*</span> <span class="hint">至少 8 位，必须包含字母和数字</span></label>
          <div class="pwd-wrap">
            <input type="password" id="password" maxlength="64" autocomplete="new-password" />
            <button type="button" class="pwd-toggle" id="pwdToggle">显示</button>
          </div>
          <p class="field-err" id="pwdErr"></p>
        </div>
        <div class="field">
          <label>确认密码<span class="req">*</span></label>
          <div class="pwd-wrap">
            <input type="password" id="confirmPwd" maxlength="64" autocomplete="new-password" />
            <button type="button" class="pwd-toggle" id="pwdToggle2">显示</button>
          </div>
          <p class="field-err" id="confirmErr"></p>
        </div>
        <div class="field">
          <label>短信验证码<span class="req">*</span></label>
          <div class="code-row">
            <input type="tel" id="code" inputmode="numeric" maxlength="6" placeholder="6 位验证码" />
            <button type="button" class="btn-code" id="btnSendCode">发送验证码</button>
          </div>
        </div>
        <div class="field">
          <label>姓名 / 昵称<span class="req">*</span></label>
          <input type="text" id="nickname" maxlength="20" placeholder="导师会这样称呼你" />
        </div>
        <div class="field">
          <label>出生年月<span class="req">*</span></label>
          <button type="button" class="select-btn" id="mBirth">
            <span class="btn-text">选择出生年月</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </button>
        </div>
      </div>

      <!-- 第 2 步 -->
      <div data-step="2" class="hidden">
        <div class="field">
          <label>目前状态<span class="req">*</span></label>
          <button type="button" class="select-btn" id="selIdentity">
            <span class="btn-text">请选择在校 / 在职 / 待业</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>

        <div id="studentFields" class="hidden">
          <div class="field">
            <label>入学年月<span class="req">*</span></label>
            <button type="button" class="select-btn" id="mEnroll">
              <span class="btn-text">选择入学年月</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </button>
          </div>
          <div class="field">
            <label>学校名称<span class="req">*</span></label>
            <input type="text" id="school" placeholder="如：西南财经大学" />
          </div>
          <div class="field">
            <label>专业分类<span class="req">*</span></label>
            <button type="button" class="select-btn" id="selMajor">
              <span class="btn-text">请选择专业分类</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          </div>
          <div class="field">
            <label>毕业日期<span class="req">*</span></label>
            <button type="button" class="select-btn" id="mExpected">
              <span class="btn-text">选择毕业日期</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </button>
          </div>
        </div>

        <div id="workingFields" class="hidden">
          <div class="field">
            <label>最近打算<span class="req">*</span></label>
            <button type="button" class="select-btn" id="selWorkGoal">
              <span class="btn-text" id="workGoalPlaceholder">请选择你最近的打算：</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          </div>
          <div class="field">
            <label>入学年月<span class="req">*</span></label>
            <button type="button" class="select-btn" id="mEnroll2">
              <span class="btn-text">选择入学年月</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </button>
          </div>
          <div class="field">
            <label>学校名称<span class="req">*</span></label>
            <input type="text" id="school2" placeholder="如：西南财经大学" />
          </div>
          <div class="field">
            <label>专业分类<span class="req">*</span></label>
            <button type="button" class="select-btn" id="selMajor2">
              <span class="btn-text">请选择专业分类</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          </div>
          <div class="field">
            <label>毕业日期<span class="req">*</span></label>
            <button type="button" class="select-btn" id="mGrad">
              <span class="btn-text">选择毕业日期</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </button>
          </div>
          <div class="field">
            <label>工作经验</label>
            <div class="exp-group">
              <div class="exp-row">
                <span class="exp-tag">全职</span>
                <button type="button" class="select-btn" id="selFullTime">
                  <span class="btn-text">请选择工作时长</span>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
              </div>
              <div class="exp-row">
                <span class="exp-tag">兼职</span>
                <button type="button" class="select-btn" id="selPartTime">

/* ============ 工具 ============ */
function $(id){ return document.getElementById(id); }
function val(id){ return $(id).value.trim(); }
function pad2(n){ return String(n).padStart(2,'0'); }
function monthNow(offsetYears){
  var d = new Date(); var y = d.getFullYear() + (offsetYears||0);
  return y + '-' + pad2(d.getMonth()+1);
}
function fmtMonth(v){
  if(!v) return '—';
  var p = v.split('-'); return p[0] + ' 年 ' + Number(p[1]) + ' 月';
}
/* 轻提示：浮层不占位，2.5 秒自动消失（验证码 Mock 用完即走） */
var toastTimer = null;
function showToast(msg){
  var box = $('toastBox');
  box.textContent = msg;
  box.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ box.classList.remove('show'); }, 2500);
}

function showAlert(msg, type){
  var box = $('alertBox');
  if(!msg){ box.innerHTML = ''; return; }
  box.innerHTML = '<div class="alert ' + (type||'err') + '" id="alertMsg">' + msg + '</div>';
  // 报错自动滚到可见位置，配合 sticky 吸顶，用户不用往上翻
  if(type !== 'info'){
    setTimeout(function(){
      var el = $('alertMsg');
      if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
    }, 30);
  }
}

/* ============ 底部弹层（列表 / 年月双模式） ============ */
function openSheet(){
  $('mask').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeSheet(){
  $('mask').classList.remove('show');
  document.body.style.overflow = '';
  monthTarget = null;
}
function showListMode(onClear){
  $('sheetList').classList.remove('hidden');
  $('sheetMonth').classList.add('hidden');
  $('sheetFoot').innerHTML =
    (onClear ? '<button type="button" class="btn btn-danger-ghost" id="sheetClearBtn">清除选择</button>' : '') +
    '<div class="spacer"></div>' +
    '<button type="button" class="btn btn-ghost" id="sheetCloseBtn">关闭</button>';
  $('sheetCloseBtn').onclick = closeSheet;
  if(onClear) $('sheetClearBtn').onclick = function(){ onClear(); closeSheet(); };
}
function openListSheet(title, options, current, onPick, onClear){
  $('sheetTitle').textContent = title;
  showListMode(current && onClear ? onClear : null);
  var list = $('sheetList');
  list.innerHTML = '';
  options.forEach(function(opt){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'sheet-item' + (opt === current ? ' sel' : '');
    b.innerHTML = '<span>' + opt + '</span>' + (opt === current ?
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : '');
    b.onclick = function(){ onPick(opt); closeSheet(); };
    list.appendChild(b);
  });
  openSheet();
}

function setSelectText(btnId, text, hasValue){
  var btn = $(btnId);
  btn.querySelector('.btn-text').textContent = text;
  btn.classList.toggle('has-value', !!hasValue);
}

/* ---- 年月模式 ---- */
function renderMonthSheet(){
  // 年份（降序）
  var yearsBox = $('monthYears');
  yearsBox.innerHTML = '';
  for(var y = monthTarget.maxY; y >= monthTarget.minY; y--){
    (function(y){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'year-chip' + (draftYear === y ? ' on' : '');
      b.textContent = y + ' 年';
      b.onclick = function(){
        draftYear = y; renderMonthSheet();
        b.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
      };
      yearsBox.appendChild(b);
    })(y);
  }
  // 月份 4×3
  var grid = $('monthGrid');
  grid.innerHTML = '';
  for(var m = 1; m <= 12; m++){
    (function(m){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'month-cell' + (draftMonth === m ? ' on' : '');
      b.textContent = m + ' 月';
      b.onclick = function(){ draftMonth = m; renderMonthSheet(); };
      grid.appendChild(b);
    })(m);
  }
  // 年、月都选了「确认」才可点
  var mc = $('mConfirm');
  if(mc) mc.disabled = !(draftYear && draftMonth);
}
function openMonthSheet(key){
  var cfg = MONTH_CFG[key];
  monthTarget = { key:key, title:cfg.title, minY:cfg.minY, maxY:cfg.maxY };
  $('sheetTitle').textContent = cfg.title;
  $('sheetList').classList.add('hidden');
  $('sheetMonth').classList.remove('hidden');
  // 显式映射取值
  var v = {birth:form.birthMonth, enroll:form.enrollMonth, expected:form.expectedGrad, grad:form.gradMonth}[key];
  if(v){ var p = v.split('-'); draftYear = Number(p[0]); draftMonth = Number(p[1]); }
  else { draftYear = null; draftMonth = null; }
  renderMonthSheet();
  // 底部：清除 / 取消 / 确认
  $('sheetFoot').innerHTML =
    '<button type="button" class="btn btn-danger-ghost" id="mClear">清除</button>' +
    '<div class="spacer"></div>' +
    '<button type="button" class="btn btn-ghost" id="mCancel">取消</button>' +
    '<button type="button" class="btn btn-primary" id="mConfirm" style="flex:0 0 auto;min-width:96px;">确认</button>';
  $('mConfirm').disabled = !(draftYear && draftMonth);
  $('mClear').onclick = function(){
    if(key === 'birth') form.birthMonth = '';
    else if(key === 'enroll') form.enrollMonth = '';
    else if(key === 'expected') form.expectedGrad = '';
    else { form.gradMonth = ''; }
    syncMonthTriggers();
    closeSheet();
  };
  $('mCancel').onclick = closeSheet;
  $('mConfirm').onclick = function(){
    if(!draftYear || !draftMonth) return;
    var value = draftYear + '-' + pad2(draftMonth);
    if(key === 'birth') form.birthMonth = value;
    else if(key === 'enroll') form.enrollMonth = value;
    else if(key === 'expected') form.expectedGrad = value;
    else form.gradMonth = value;
    syncMonthTriggers();
    closeSheet();
  };
  openSheet();
}
function syncMonthTriggers(){
  setSelectText('mBirth', form.birthMonth ? fmtMonth(form.birthMonth) : '选择出生年月', !!form.birthMonth);
  setSelectText('mEnroll', form.enrollMonth ? fmtMonth(form.enrollMonth) : '选择入学年月', !!form.enrollMonth);
  setSelectText('mEnroll2', form.enrollMonth ? fmtMonth(form.enrollMonth) : '选择入学年月', !!form.enrollMonth);
  setSelectText('mExpected', form.expectedGrad ? fmtMonth(form.expectedGrad) : '选择毕业日期', !!form.expectedGrad);
  setSelectText('mGrad', form.gradMonth ? fmtMonth(form.gradMonth) : '选择毕业日期', !!form.gradMonth);
}

function bindPwdToggle(btnId, inputId){
  $(btnId).onclick = function(){
    var input = $(inputId);

    input.type = show ? 'text' : 'password';
    this.textContent = show ? '隐藏' : '显示';

}

/* 密码 / 确认密码：离开输入框即时校验 */
function pwdHint(v){
  if(!v) return '';
  if(v.length < 8 || !/[a-zA-Z]/.test(v) || !/[0-9]/.test(v)) return '密码至少 8 位，且必须包含字母和数字';
  return '';
}
function setFieldErr(errId, inputId, msg){
  $(errId).textContent = msg || '';
  $(inputId).classList.toggle('input-err', !!msg);
}
$('password').addEventListener('blur', function(){
  setFieldErr('pwdErr', 'password', this.value ? pwdHint(this.value) : '');
});
$('password').addEventListener('input', function(){
  setFieldErr('pwdErr', 'password', '');
  if($('confirmPwd').value){
    setFieldErr('confirmErr', 'confirmPwd', $('confirmPwd').value === this.value ? '' : '两次输入的密码不一致');
  }
});
$('confirmPwd').addEventListener('blur', function(){
  var msg = '';
  if(this.value) msg = this.value === $('password').value ? '' : '两次输入的密码不一致';
  setFieldErr('confirmErr', 'confirmPwd', msg);
});
$('confirmPwd').addEventListener('input', function(){
  setFieldErr('confirmErr', 'confirmPwd', '');
});

$('mBirth').onclick = function(){ openMonthSheet('birth'); };
$('mEnroll').onclick = function(){ openMonthSheet('enroll'); };
$('mEnroll2').onclick = function(){ openMonthSheet('enroll'); };
$('mExpected').onclick = function(){ openMonthSheet('expected'); };
$('mGrad').onclick = function(){ openMonthSheet('grad'); };

$('btnSendCode').onclick = function(){
  var phone = val('phone');
  var pwd = $('password').value;
  var cpwd = $('confirmPwd').value;
  if(!/^1[3-9]\d{9}$/.test(phone)){ showAlert('请输入有效的 11 位手机号'); return; }
  if(pwd.length < 8 || !/[a-zA-Z]/.test(pwd) || !/[0-9]/.test(pwd)){ showAlert('密码至少 8 位，且必须包含字母和数字'); return; }
  if(pwd !== cpwd){ showAlert('两次输入的密码不一致'); return; }

  var mock = String(Math.floor(100000 + Math.random()*900000));
  form.sentCode = mock;
  $('code').value = mock;
  showToast('验证码：' + mock + '（原型 Mock，不会真的发短信）');

  countdown = 60;
  var btn = $('btnSendCode');
  btn.disabled = true;
  btn.textContent = '60s 后重发';
  clearInterval(countdownTimer);
  countdownTimer = setInterval(function(){
    countdown--;
    if(countdown <= 0){
      clearInterval(countdownTimer);
      btn.disabled = false;
      btn.textContent = '重新发送';
    } else {
      btn.textContent = countdown + 's 后重发';
    }
  }, 1000);
};

/* ============ 第 2 步交互 ============ */
$('selIdentity').onclick = function(){
  openListSheet('请选择在校 / 在职 / 待业', ['在校','在职','待业'],
    form.identity === 'student' ? '在校' : (form.identity === 'working' ? '在职' : (form.identity === 'jobless' ? '待业' : '')),
    function(v){
      var next = v === '在校' ? 'student' : (v === '在职' ? 'working' : 'jobless');
      form.identity = next;
      setSelectText('selIdentity', v, true);
      $('studentFields').classList.toggle('hidden', next !== 'student');
      $('workingFields').classList.toggle('hidden', next === 'student');
      // 切换在职/待业后，清空不属于新身份的想法
      var goals = next === 'jobless' ? GOALS_JOBLESS : GOALS_WORKING;
      if(form.workGoal && goals.indexOf(form.workGoal) < 0){
        form.workGoal = '';
      }
      $('workGoalPlaceholder').textContent = '请选择你最近的打算：';
      setSelectText('selWorkGoal', $('workGoalPlaceholder').textContent, !!form.workGoal);
      // 同步两个分支共享字段的显示
      syncMonthTriggers();
      $('school').value = form.school || '';
      $('school2').value = form.school || '';
      setSelectText('selMajor', form.major || '请选择专业分类', !!form.major);
      setSelectText('selMajor2', form.major || '请选择专业分类', !!form.major);
    });
};
$('selMajor').onclick = function(){
  openListSheet('请选择专业分类', MAJORS, form.major, function(v){
    form.major = v; setSelectText('selMajor', v, true);
  });
};
$('selMajor2').onclick = function(){
  openListSheet('请选择专业分类', MAJORS, form.major, function(v){
    form.major = v; setSelectText('selMajor2', v, true);
  });
};
$('selWorkGoal').onclick = function(){
  if(!form.identity || form.identity === 'student') return;
  var goals = form.identity === 'jobless' ? GOALS_JOBLESS : GOALS_WORKING;
  openListSheet('请选择你最近的打算：', goals, form.workGoal, function(v){
    form.workGoal = v;
    setSelectText('selWorkGoal', v, true);
  });
};
$('selFullTime').onclick = function(){
  openListSheet('全职：请选择工作时长', EXP_DURATIONS, form.fullTimeExp, function(v){
    form.fullTimeExp = v; setSelectText('selFullTime', v, true);
  }, function(){
    form.fullTimeExp = ''; setSelectText('selFullTime', '请选择工作时长', false);
  });
};
$('selPartTime').onclick = function(){
  openListSheet('兼职：请选择工作时长', EXP_DURATIONS, form.partTimeExp, function(v){
    form.partTimeExp = v; setSelectText('selPartTime', v, true);
  }, function(){
    form.partTimeExp = ''; setSelectText('selPartTime', '请选择工作时长', false);
  });
};

/* ============ 第 3 步交互：省市级联 ============ */
var SINGLE_CITY_PROVINCES = ['北京市','天津市','上海市','重庆市','香港特别行政区','澳门特别行政区','海外'];
function isSingleCity(p){ return SINGLE_CITY_PROVINCES.indexOf(p) >= 0; }
function cityListOf(p, tail){
  return (PROVINCE_CITIES[p] || []).concat(isSingleCity(p) ? [] : [tail]);
}
function bindProvince(btnId, cityBtnId, keyP, keyC, tail){
  $(btnId).onclick = function(){
    openListSheet('选择省份', PROVINCES, form[keyP], function(v){
      form[keyP] = v;
      setSelectText(btnId, v, true);
      var cityBtn = $(cityBtnId);
      if(isSingleCity(v)){
        // 直辖市/港澳/海外：市栏自动带出同名并置灰
        form[keyC] = v;
        setSelectText(cityBtnId, v, true);
        cityBtn.disabled = true;
      } else {
        form[keyC] = '';
        setSelectText(cityBtnId, '选择城市', false);
        cityBtn.disabled = false;
      }
    });
  };
  $(cityBtnId).onclick = function(){
    if(!form[keyP]){ return; }
    if(isSingleCity(form[keyP])){ return; }
    openListSheet(form[keyP] + ' · 选择城市', cityListOf(form[keyP], tail), form[keyC], function(v){
      form[keyC] = v; setSelectText(cityBtnId, v, true);
    });
  };
}
bindProvince('selWorkProvince','selWorkCity','workProvince','workCity','均可考虑');
bindProvince('selCurProvince','selCurCity','curProvince','curCity','其他');

/* 职业 chips */
CAREERS.forEach(function(name){
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'chip';
  b.textContent = name;
  b.onclick = function(){
    var i = form.careers.indexOf(name);
    if(i >= 0){ form.careers.splice(i,1); b.classList.remove('on'); }
    else { form.careers.push(name); b.classList.add('on'); }
    $('chipCount').textContent = '已选 ' + form.careers.length + ' 个';
  };
  $('chips').appendChild(b);
});

/* ============ 校验与翻页 ============ */
function validateStep1(){
  form.phone = val('phone');
  form.password = $('password').value;
  form.code = val('code');
  form.nickname = val('nickname');
  if(!/^1[3-9]\d{9}$/.test(form.phone)) return '请输入有效的 11 位手机号';
  if(form.password.length < 8 || !/[a-zA-Z]/.test(form.password) || !/[0-9]/.test(form.password)) return '密码至少 8 位，且必须包含字母和数字';
  if(form.password !== $('confirmPwd').value) return '两次输入的密码不一致';
  if(!form.sentCode || form.code !== form.sentCode) return '请填写正确的短信验证码';
  if(!form.nickname) return '请填写姓名或昵称';
  if(!form.birthMonth) return '请选择出生年月';
  if(form.birthMonth > monthNow(-15)) return '年龄需满 15 岁';
  return '';
}
function validateStep2(){
  var now = monthNow(0);
  if(!form.identity) return '请选择你目前的状态';
  if(form.identity === 'student'){
    form.school = val('school');
    if(!form.enrollMonth) return '请选择入学年月';
    if(!form.school) return '请填写学校名称';
    if(!form.major) return '请选择专业分类';
    if(!form.expectedGrad) return '请选择毕业日期';
    if(form.expectedGrad < now) return '毕业日期不能早于当前月份';
    if(form.expectedGrad <= form.enrollMonth) return '毕业日期需要晚于入学年月';
  } else {
    form.school = val('school2');
    if(!form.workGoal) return '请选择你最近的打算';
    if(!form.enrollMonth) return '请选择入学年月';
    if(!form.school) return '请填写学校名称';
    if(!form.major) return '请选择专业分类';
    if(!form.gradMonth) return '请选择毕业日期';
    if(form.gradMonth > now) return '毕业日期不能晚于当前月份';
    if(form.gradMonth <= form.enrollMonth) return '毕业日期需要晚于入学年月';
  }
  return '';
}
function validateStep3(){
  if(!form.workProvince || !form.workCity) return '请选择希望工作地点（省 / 市）';
  if(!form.curProvince || !form.curCity) return '请选择目前所在地（省 / 市）';
  if(form.careers.length === 0) return '请至少选择一个感兴趣的职业方向';
  return '';
}

function renderStep(){
  $('stepTitle').textContent = STEP_META[step-1].title;
  var subEl = $('stepSub');
  var sub = STEP_META[step-1].sub;
  if(sub){ subEl.textContent = sub; subEl.classList.remove('hidden'); }
  else { subEl.textContent = ''; subEl.classList.add('hidden'); }
  document.querySelectorAll('[data-step]').forEach(function(el){
    el.classList.toggle('hidden', Number(el.getAttribute('data-step')) !== step);
  });
  for(var n=1; n<=3; n++){
    var node = document.querySelector('[data-node="'+n+'"]');
    node.classList.toggle('reached', step >= n);
    node.classList.toggle('passed', step > n);
    var dot = document.querySelector('[data-dot="'+n+'"]');
    dot.innerHTML = step > n ?
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      : String(n);
  }
  document.querySelector('[data-line="1"]').classList.toggle('done', step > 1);
  document.querySelector('[data-line="2"]').classList.toggle('done', step > 2);
  $('btnBack').classList.toggle('hidden', step === 1);
  $('btnNext').textContent = step === 3 ? '完成注册' : '下一步';
  showAlert('');
}

$('btnBack').onclick = function(){ if(step > 1){ step--; renderStep(); } };
$('btnNext').onclick = function(){
  var msg = '';
  if(step === 1) msg = validateStep1();
  else if(step === 2) msg = validateStep2();
  else msg = validateStep3();
  if(msg){ showAlert(msg); return; }
  if(step < 3){ step++; renderStep(); return; }
  submitPrototype();
};

/* ============ 成功页 ============ */
function group(title, rows){
  return '<div class="sum-group"><h3>' + title + '</h3>' +
    rows.map(function(r){
      return '<div class="sum-row"><dt>' + r[0] + '</dt><dd>' + (r[1] || '—') + '</dd></div>';
    }).join('') + '</div>';
}
function submitPrototype(){
  var identityText = form.identity === 'student' ? '在校' : (form.identity === 'working' ? '在职' : '待业');
  var groups = '';
  groups += group('账号信息', [
    ['手机号', form.phone],
    ['姓名 / 昵称', form.nickname],
    ['出生年月', fmtMonth(form.birthMonth)]
  ]);
  if(form.identity === 'student'){
    groups += group('在校信息', [
      ['目前状态','在校'],
      ['入学年月', fmtMonth(form.enrollMonth)],
      ['学校', form.school],
      ['专业分类', form.major],
      ['毕业日期', fmtMonth(form.expectedGrad)]
    ]);
  } else {
    groups += group(identityText + '信息', [
      ['目前状态', identityText],
      ['最近打算', form.workGoal],
      ['入学年月', fmtMonth(form.enrollMonth)],
      ['学校', form.school],
      ['专业分类', form.major],
      ['毕业日期', fmtMonth(form.gradMonth)],
      ['全职', form.fullTimeExp || '未选'],
      ['兼职', form.partTimeExp || '未选']
    ]);
  }
  groups += group('方向与地点', [
    ['希望工作地点', form.workProvince + ' · ' + form.workCity],
    ['目前所在地', form.curProvince + ' · ' + form.curCity],
    ['感兴趣的职业方向', form.careers.join('、')]
  ]);
  $('summary').innerHTML = groups;
  $('formView').classList.add('hidden');
  $('doneView').classList.remove('hidden');
  window.scrollTo(0,0);
}
$('btnBackEdit').onclick = function(){
  $('doneView').classList.add('hidden');
  $('formView').classList.remove('hidden');
};
$('btnRestart').onclick = function(){ location.reload(); };

/* 初始化 */
renderStep();
syncMonthTriggers();
</script>

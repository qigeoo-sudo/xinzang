<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Ying Wang：方圆脸、剑眉、细框眼镜、藏蓝西服+白衬衫+暗红领带 -->
  <rect width="200" height="200" fill="#F6EDDE"/>
  <circle cx="100" cy="100" r="92" fill="#FBF5E9"/>

  <!-- 西服（肩更宽） -->
  <path d="M26 200 C28 170 48 151 76 144 L100 154 L124 144 C152 151 172 170 174 200 Z" fill="#2A3B55"/>
  <path d="M80 146 L100 154 L120 146 L114 138 L100 145 L86 138 Z" fill="#FFFFFF"/>
  <path d="M100 148 L94 154 L100 186 L106 154 Z" fill="#8C3A32"/>
  <path d="M96 146 L104 146 L102 152 L98 152 Z" fill="#7A3028"/>
  <path d="M80 146 L96 168 L88 174 L74 152 Z" fill="#223146"/>
  <path d="M120 146 L104 168 L112 174 L126 152 Z" fill="#223146"/>

  <!-- 脖子（更宽） -->
  <path d="M90 112 h20 v28 c0 5 -20 5 -20 0 Z" fill="#F7D6BC"/>
  <path d="M90 112 h20 v9 c-6.5 5 -13.5 5 -20 0 Z" fill="#ECC2A5"/>

  <!-- 耳朵 -->
  <circle cx="69" cy="93" r="6" fill="#F7D6BC"/>
  <circle cx="131" cy="93" r="6" fill="#F7D6BC"/>

  <!-- 方圆脸：两侧较直，下颌有棱角 -->
  <path d="M71 84 C71 63 83 53 100 53 C117 53 129 63 129 84 L129 92 C129 107 121 118 111 122 C106 124 94 124 89 122 C79 118 71 107 71 92 Z" fill="#F7D6BC"/>

  <!-- 短发 -->
  <path d="M69 90 C66 55 84 43 100 43 C116 43 134 55 131 90 C129 75 125 66 118 61 C110 56 90 56 82 61 C75 66 71 75 69 90 Z" fill="#2E2620"/>
  <!-- 鬓角 -->
  <path d="M70 84 L70 97 L75 97 L74 84 Z" fill="#2E2620"/>
  <path d="M130 84 L130 97 L125 97 L126 84 Z" fill="#2E2620"/>
  <path d="M84 51 C91 45 101 44 109 46 C100 47 92 50 84 56 Z" fill="#4C3C31" opacity=".7"/>

  <!-- 剑眉（粗平，压在镜框上方） -->
  <path d="M79 76 L95 75" stroke="#3A2E26" stroke-width="3" stroke-linecap="round"/>
  <path d="M105 75 L121 76" stroke="#3A2E26" stroke-width="3" stroke-linecap="round"/>

  <!-- 细框眼镜 -->
  <rect x="80.5" y="82" width="15" height="12" rx="4.5" fill="#FFFFFF" opacity=".14" stroke="#4A3B33" stroke-width="1.6"/>
  <rect x="104.5" y="82" width="15" height="12" rx="4.5" fill="#FFFFFF" opacity=".14" stroke="#4A3B33" stroke-width="1.6"/>
  <path d="M95.5 86.5 L104.5 86.5" stroke="#4A3B33" stroke-width="1.6"/>
  <path d="M80.5 87 L69.5 89" stroke="#4A3B33" stroke-width="1.6"/>
  <path d="M119.5 87 L130.5 89" stroke="#4A3B33" stroke-width="1.6"/>

  <!-- 眼（小而有神） -->
  <ellipse cx="88" cy="88.5" rx="2.7" ry="3" fill="#33261E"/>
  <ellipse cx="112" cy="88.5" rx="2.7" ry="3" fill="#33261E"/>
  <circle cx="89" cy="87.4" r=".9" fill="#FFFFFF" opacity=".85"/>
  <circle cx="113" cy="87.4" r=".9" fill="#FFFFFF" opacity=".85"/>

  <!-- 鼻（直） -->
  <path d="M100 93 L99.4 101 Q99.2 103.5 97 104" stroke="#D9A98C" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- 抿嘴微笑 -->
  <path d="M93 109 Q100 112 107 109" stroke="#C96F5E" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- 腮红（淡） -->
  <ellipse cx="79" cy="101" rx="4.5" ry="2.6" fill="#F2B49A" opacity=".3"/>
  <ellipse cx="121" cy="101" rx="4.5" ry="2.6" fill="#F2B49A" opacity=".3"/>
</svg>

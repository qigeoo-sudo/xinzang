# 本地开发用 MySQL（启动：docker compose -f docker-compose.dev.yml up -d）
services:
  mysql:
    image: mysql:8.4
    container_name: xinzang-mysql-dev
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: xinzang_dev
      TZ: Asia/Shanghai
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - xinzang-mysql-data:/var/lib/mysql

volumes:
  xinzang-mysql-data:

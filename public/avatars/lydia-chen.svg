  <path d="M65 88 C64 102 64 114 68 122 C72 129 80 128 80 119 L80 94 Z" fill="#2E2620"/>

  <!-- 白衬衫 -->
  <path d="M78 144 L100 154 L122 144 L116 136 L100 145 L84 136 Z" fill="#FFFFFF"/>
  <!-- 鼠尾草绿西装（含肩） -->
  <path d="M29 200 C31 170 50 152 76 145 L100 154 L124 145 C150 152 169 170 171 200 Z" fill="#75875A"/>
  <!-- 翻领 -->
  <path d="M76 145 L94 167 L85 174 L70 151 Z" fill="#657650"/>
  <path d="M124 145 L106 167 L115 174 L130 151 Z" fill="#657650"/>


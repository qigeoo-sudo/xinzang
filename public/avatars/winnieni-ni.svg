<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Winnie Ni：鹅蛋脸、平直细眉、眼距宽、浅微笑、藏蓝西装+白衬衫 -->
  <rect width="200" height="200" fill="#F6EDDE"/>
  <circle cx="100" cy="100" r="92" fill="#FBF5E9"/>

  <!-- 后层发（黑长直垂肩下） -->
  <path d="M64 88 C60 48 82 36 100 36 C118 36 140 48 136 88 C138 110 139 128 134 144 C130 154 122 153 121 143 L121 96 Z" fill="#26201C"/>
  <path d="M64 88 C62 110 61 128 66 144 C70 154 78 153 79 143 L79 96 Z" fill="#26201C"/>

  <!-- 白衬衫 -->
  <path d="M78 145 L100 155 L122 145 L116 137 L100 146 L84 137 Z" fill="#FFFFFF"/>
  <!-- 藏蓝西装 -->
  <path d="M29 200 C31 170 50 152 76 145 L100 155 L124 145 C150 152 169 170 171 200 Z" fill="#2E4360"/>
  <path d="M76 145 L94 168 L85 175 L70 152 Z" fill="#263850"/>
  <path d="M124 145 L106 168 L115 175 L130 152 Z" fill="#263850"/>

  <!-- 脖子 -->
  <path d="M91 110 h18 v29 c0 5 -18 5 -18 0 Z" fill="#F6DCC8"/>
  <path d="M91 110 h18 v9 c-6 5 -12 5 -18 0 Z" fill="#ECC6AA"/>

  <!-- 脸（鹅蛋，无耳饰，发半掩耳） -->
  <ellipse cx="100" cy="88" rx="28" ry="32.5" fill="#F6DCC8"/>

  <!-- 前发：侧分长直发 -->
  <path d="M69 92 C64 50 84 38 100 38 C116 38 136 50 131 92 C128 72 120 60 100 60 C90 60 81 66 76 76 C72 82 70 87 69 92 Z" fill="#26201C"/>
  <path d="M69 92 C66 106 66 122 70 134 C73 140 79 138 78 130 C76 118 75 102 76 92 Z" fill="#26201C"/>
  <path d="M131 92 C134 106 134 122 130 134 C127 140 121 138 122 130 C124 118 125 102 124 92 Z" fill="#26201C"/>
  <path d="M84 49 C93 43 107 43 115 48 C104 46 93 47 84 53 Z" fill="#42332B" opacity=".7"/>

  <!-- 平直细眉（略低平，安静感） -->
  <path d="M81 79.5 L95 78.5" stroke="#3A2E26" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M105 78.5 L119 79.5" stroke="#3A2E26" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 眼距略宽的细长眼 + 上睫线 -->
  <ellipse cx="86.5" cy="88.5" rx="3.3" ry="3" fill="#33261E"/>
  <ellipse cx="113.5" cy="88.5" rx="3.3" ry="3" fill="#33261E"/>
  <circle cx="87.6" cy="87.4" r=".9" fill="#FFFFFF" opacity=".85"/>
  <circle cx="114.6" cy="87.4" r=".9" fill="#FFFFFF" opacity=".85"/>
  <path d="M82.5 86.3 Q86.5 84.3 90.5 86" stroke="#33261E" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <path d="M109.5 86 Q113.5 84.3 117.5 86.3" stroke="#33261E" stroke-width="1.1" fill="none" stroke-linecap="round"/>

  <!-- 鼻（轻描） -->
  <path d="M100 95 q1 2.8 -1.5 3.8" stroke="#D9A98C" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- 浅微笑 -->
  <path d="M94 107 q6 3.5 12 0" stroke="#C96F5E" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 腮红（很淡） -->
  <ellipse cx="80" cy="99.5" rx="4.6" ry="2.6" fill="#F2B49A" opacity=".3"/>
  <ellipse cx="120" cy="99.5" rx="4.6" ry="2.6" fill="#F2B49A" opacity=".3"/>
</svg>

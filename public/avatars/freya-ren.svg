<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Freya Ren：齐肩发女性，砖红西装+米色衬衫 -->
  <rect width="200" height="200" fill="#F6EDDE"/>
  <circle cx="100" cy="100" r="92" fill="#FBF5E9"/>

  <!-- 后层长发（垂至肩） -->
  <path d="M64 88 C60 48 82 36 100 36 C118 36 140 48 136 88 C138 108 140 126 136 142 C132 152 124 152 122 142 L122 96 Z" fill="#3A2C24"/>
  <path d="M64 88 C62 108 60 126 64 142 C68 152 76 152 78 142 L78 96 Z" fill="#3A2C24"/>

  <!-- 米色衬衫 -->
  <path d="M76 146 L100 156 L124 146 L118 138 L100 147 L82 138 Z" fill="#F5EBDD"/>
  <!-- 砖红西装（含肩） -->
  <path d="M28 200 C30 170 50 152 76 145 L100 156 L124 145 C150 152 170 170 172 200 Z" fill="#A05238"/>
  <!-- 翻领 -->
  <path d="M76 145 L94 168 L85 175 L70 152 Z" fill="#8C4630"/>
  <path d="M124 145 L106 168 L115 175 L130 152 Z" fill="#8C4630"/>

  <!-- 脖子 -->
  <path d="M91 110 h18 v30 c0 5 -18 5 -18 0 Z" fill="#F8DDC6"/>
  <path d="M91 110 h18 v9 c-6 5 -12 5 -18 0 Z" fill="#EFC7AC"/>

  <!-- 脸 -->
  <ellipse cx="100" cy="88" rx="29" ry="33" fill="#F8DDC6"/>

  <!-- 前发：侧分刘海 + 两侧垂发 -->
  <path d="M69 92 C64 52 84 40 100 40 C116 40 136 52 131 92 C128 74 122 62 100 62 C92 62 84 66 80 74 C75 80 71 86 69 92 Z" fill="#3A2C24"/>
  <path d="M69 92 C67 104 67 116 71 126 C74 132 80 130 79 122 C77 112 76 100 77 92 Z" fill="#3A2C24"/>
  <path d="M131 92 C133 104 133 116 129 126 C126 132 120 130 121 122 C123 112 124 100 123 92 Z" fill="#3A2C24"/>
  <path d="M86 50 C94 44 106 44 114 49 C104 47 94 48 86 54 Z" fill="#544235" opacity=".65"/>

  <!-- 眉（柔和弯眉） -->
  <path d="M81 79 q7 -4 14 -1" stroke="#3A2E26" stroke-width="2.1" fill="none" stroke-linecap="round"/>
  <path d="M105 78 q7 -3 14 1" stroke="#3A2E26" stroke-width="2.1" fill="none" stroke-linecap="round"/>
  <!-- 眼 -->
  <ellipse cx="88" cy="88" rx="3.1" ry="3.9" fill="#33261E"/>
  <ellipse cx="112" cy="88" rx="3.1" ry="3.9" fill="#33261E"/>
  <circle cx="89.1" cy="86.7" r="1" fill="#FFFFFF" opacity=".85"/>
  <circle cx="113.1" cy="86.7" r="1" fill="#FFFFFF" opacity=".85"/>
  <!-- 鼻 -->
  <path d="M100 94 q1.5 4 -2 6" stroke="#D9A98C" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- 嘴 -->
  <path d="M92 106 q8 5 16 0" stroke="#C96F5E" stroke-width="2.3" fill="none" stroke-linecap="round"/>
  <!-- 腮红 -->
  <ellipse cx="80" cy="99" rx="5" ry="3" fill="#F2B49A" opacity=".45"/>
  <ellipse cx="120" cy="99" rx="5" ry="3" fill="#F2B49A" opacity=".45"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Ying Wang：短发男性，藏蓝西服+白衬衫+暗红领带 -->
  <rect width="200" height="200" fill="#F6EDDE"/>
  <circle cx="100" cy="100" r="92" fill="#FBF5E9"/>

  <!-- 西服（含肩） -->
  <path d="M30 200 C32 170 50 152 76 145 L100 154 L124 145 C150 152 168 170 170 200 Z" fill="#2A3B55"/>
  <!-- 衬衫 V 领 -->
  <path d="M80 146 L100 154 L120 146 L114 138 L100 145 L86 138 Z" fill="#FFFFFF"/>
  <!-- 领带 -->
  <path d="M100 148 L94 154 L100 186 L106 154 Z" fill="#8C3A32"/>
  <path d="M96 146 L104 146 L102 152 L98 152 Z" fill="#7A3028"/>
  <!-- 西服翻领 -->
  <path d="M80 146 L96 168 L88 174 L74 152 Z" fill="#223146"/>
  <path d="M120 146 L104 168 L112 174 L126 152 Z" fill="#223146"/>

  <!-- 脖子 -->
  <path d="M91 110 h18 v28 c0 5 -18 5 -18 0 Z" fill="#F8DDC6"/>
  <path d="M91 110 h18 v9 c-6 5 -12 5 -18 0 Z" fill="#EFC7AC"/>

  <!-- 耳朵 -->
  <circle cx="68" cy="93" r="6" fill="#F8DDC6"/>
  <circle cx="132" cy="93" r="6" fill="#F8DDC6"/>

  <!-- 脸 -->
  <ellipse cx="100" cy="88" rx="30" ry="34" fill="#F8DDC6"/>

  <!-- 短发：顶部圆润，鬓角利落 -->
  <path d="M68 92 C64 52 82 38 100 38 C118 38 136 52 132 92 C131 80 128 70 122 64 C112 58 96 57 86 62 C76 67 70 78 68 92 Z" fill="#2E2620"/>
  <path d="M84 52 C90 46 100 44 108 46 C100 47 92 50 84 56 Z" fill="#4C3C31" opacity=".7"/>

  <!-- 眉（男性略粗平） -->
  <path d="M80 79 q8 -3 15 0" stroke="#3A2E26" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M105 79 q7 -3 15 0" stroke="#3A2E26" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <!-- 眼 -->
  <ellipse cx="88" cy="88" rx="3.1" ry="3.8" fill="#33261E"/>
  <ellipse cx="112" cy="88" rx="3.1" ry="3.8" fill="#33261E"/>
  <circle cx="89.1" cy="86.8" r="1" fill="#FFFFFF" opacity=".85"/>
  <circle cx="113.1" cy="86.8" r="1" fill="#FFFFFF" opacity=".85"/>
  <!-- 鼻 -->
  <path d="M100 94 q1.5 4 -2 6" stroke="#D9A98C" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- 嘴（温和微笑） -->
  <path d="M92 106 q8 5 16 0" stroke="#C96F5E" stroke-width="2.3" fill="none" stroke-linecap="round"/>
  <!-- 腮红 -->
  <ellipse cx="80" cy="99" rx="5" ry="3" fill="#F2B49A" opacity=".38"/>
  <ellipse cx="120" cy="99" rx="5" ry="3" fill="#F2B49A" opacity=".38"/>
</svg>
